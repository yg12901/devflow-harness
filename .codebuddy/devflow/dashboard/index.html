<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devflow 看板</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e6e8ee; --dim: #8b93a7;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --run: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 12px; }
  main { padding: 20px 24px; display: grid; gap: 20px; grid-template-columns: minmax(0,2fr) minmax(280px,1fr); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel > h2 {
    margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 600;
    border-bottom: 1px solid var(--line); color: var(--dim); letter-spacing: .5px;
  }
  .body { padding: 8px 16px 16px; }
  .run { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .run:last-child { border-bottom: none; }
  .run-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .run-title { font-weight: 600; }
  .run-meta { color: var(--dim); font-size: 12px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--run); transition: width .4s; }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; }
  .stage {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .stage.passed  { color: var(--ok);   border-color: rgba(63,185,80,.4);  background: rgba(63,185,80,.08); }
  .stage.running { color: var(--run);  border-color: rgba(88,166,255,.4); background: rgba(88,166,255,.08); }
  .stage.failed  { color: var(--bad);  border-color: rgba(248,81,73,.4);  background: rgba(248,81,73,.08); }
  .stage.blocked { color: var(--warn); border-color: rgba(210,153,34,.4); background: rgba(210,153,34,.08); }
  .stage.skipped { opacity: .4; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); }
  .p0 { color: var(--bad);  border-color: rgba(248,81,73,.4); }
  .p1 { color: var(--warn); border-color: rgba(210,153,34,.4); }
  .p2 { color: var(--dim); }
  .learn { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .learn:last-child { border-bottom: none; }
  .learn-head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .learn .fix { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .learn .st { color: var(--dim); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tag { font-size: 10px; color: var(--dim); }
  .empty { color: var(--dim); padding: 20px 0; text-align: center; font-size: 13px; }
  .counts { display: flex; gap: 14px; font-size: 12px; color: var(--dim); padding: 4px 0 10px; }
  .counts b { color: var(--fg); font-weight: 600; }
  code { background: rgba(255,255,255,.05); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>devflow 看板</h1>
  <span class="sub">每 3 秒自动刷新 · 数据来自 <code>.codebuddy/devflow/runs/</code> 与 <code>learnings/</code></span>
</header>

<main>
  <section class="panel">
    <h2>流水线运行</h2>
    <div class="body" id="runs"><div class="empty">加载中…</div></div>
  </section>

  <section class="panel">
    <h2>自学习经验库</h2>
    <div class="body" id="learnings"><div class="empty">加载中…</div></div>
  </section>
</main>

<script>
const STAGE_LABEL = {
  S1: "需求分析", S2: "方案拆分", S3: "编码", S4: "评审",
  S5: "测试", S6: "发布", S7: "沉淀"
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]
  ));
}

async function get(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function renderRuns() {
  const el = document.getElementById("runs");
  let data;
  try { data = await get("/api/runs"); }
  catch (e) { el.innerHTML = '<div class="empty">无法读取运行数据</div>'; return; }

  if (!data.runs.length) {
    el.innerHTML = '<div class="empty">还没有运行记录。<br>执行 <code>devflow init</code> 或在 CodeBuddy 里输入 <code>/flow &lt;需求&gt;</code> 开始。</div>';
    return;
  }

  const blocks = await Promise.all(data.runs.map(async run => {
    let detail = null;
    try { detail = await get("/api/runs/" + encodeURIComponent(run.run_id)); } catch (e) {}
    const stages = (detail && detail.stages || []).map(s =>
      `<span class="stage ${esc(s.status)}" title="${esc(s.name)}${s.gate_score != null ? " · " + s.gate_score + " 分" : ""}${s.attempts > 1 ? " · 重试 " + (s.attempts - 1) + " 次" : ""}">${esc(s.id)} ${esc(STAGE_LABEL[s.id] || s.name)}</span>`
    ).join("");
    const blockers = (detail && detail.blockers || []);
    return `
      <div class="run">
        <div class="run-head">
          <span class="run-title">${esc(run.title || run.run_id)}</span>
          <span class="run-meta">${esc(run.run_id)} · ${esc(run.status)} · ${run.progress}%</span>
        </div>
        <div class="bar"><i style="width:${run.progress}%"></i></div>
        <div class="stages">${stages}</div>
        ${blockers.length ? `<div class="st" style="color:var(--warn);margin-top:8px">阻塞：${esc(blockers.join("；"))}</div>` : ""}
      </div>`;
  }));
  el.innerHTML = blocks.join("");
}

async function renderLearnings() {
  const el = document.getElementById("learnings");
  let data;
  try { data = await get("/api/learnings"); }
  catch (e) { el.innerHTML = '<div class="empty">无法读取经验库</div>'; return; }

  const o = data.overview;
  const head = `<div class="counts">
    <span><b>${o.total}</b> 条</span>
    <span>P0 <b>${o.by_priority.P0}</b></span>
    <span>P1 <b>${o.by_priority.P1}</b></span>
    <span>P2 <b>${o.by_priority.P2}</b></span>
    <span>已验证 <b>${o.proven}</b></span>
    <span>待改写 <b>${o.needs_rewrite}</b></span>
  </div>`;

  const order = { P0: 0, P1: 1, P2: 2 };
  const items = data.entries
    .filter(e => e.status !== "retired")
    .sort((a, b) => (order[a.priority] - order[b.priority]) || (b.stats.hits - a.stats.hits))
    .map(e => {
      const st = e.stats || {};
      const flags = [];
      if (st.proven) flags.push("已验证");
      if (e.status === "needs_rewrite") flags.push("待改写");
      return `<div class="learn">
        <div class="learn-head">
          <span class="pill ${esc((e.priority || "p2").toLowerCase())}">${esc(e.priority)}</span>
          <span class="tag">${esc(e.id)} · ${esc(e.stage === "*" ? "全阶段" : e.stage)}</span>
          ${flags.length ? `<span class="tag">· ${esc(flags.join(" · "))}</span>` : ""}
        </div>
        <div>${esc(e.pattern)}</div>
        ${e.fix ? `<div class="fix">对策：${esc(e.fix)}</div>` : ""}
        <div class="st">命中 ${st.hits || 0} 次 · 跨 ${st.runs || 0} 个需求 · 注入 ${st.injected || 0} 次 · 注入后仍失败 ${st.fail_after_inject || 0} 次</div>
      </div>`;
    }).join("");

  el.innerHTML = head + (items || '<div class="empty">经验库为空</div>');
}

function refresh() { renderRuns(); renderLearnings(); }
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
